# ── Observatorio de Arrecifes — México ──
# Archivo: /etc/nginx/http.d/cercu.conf (bloques arrecifes)
# Frontend: PM2 arrecifes en puerto 3007
# Backend:  PM2 cercu-backend en puerto 3003
#
# Pegar AMBOS bloques al final de cercu.conf, igual que el patrón de humedales.

server {
    server_name arrecifes.cercu.com.mx;

    # API proxy → cercu-backend
    #
    # `proxy_read_timeout 300s` permite que endpoints síncronos pesados
    # (refresh-climate batch NASA POWER × 12 reefs ≈ 5 s, snapshot batch,
    # análisis NDBI batch GEE) terminen sin que nginx mate la conexión.
    # El default de nginx es 60s — produce 502 Bad Gateway en jobs largos.
    #
    # El detector OSM NO se beneficia de este timeout (puede tardar 7+ min):
    # ese ya usa background job con polling (`/coastal-intrusions/jobs/:id`).
    location /api/ {
        proxy_pass http://127.0.0.1:3003/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;

        # Buffers grandes para respuestas con muchos snapshots / news.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Frontend → Nuxt
    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/arrecifes.cercu.com.mx/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/arrecifes.cercu.com.mx/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


server {
    if ($host = arrecifes.cercu.com.mx) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name arrecifes.cercu.com.mx;
    return 404; # managed by Certbot
}
